name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          # 署名检查要能走完整个历史（默认 depth=1 会让它只看得到一笔 —— 那就是把尺子遮住了）
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # pnpm 只是这里的安装器；npm install 同样可行（见 CONTRIBUTING，已实测）。
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      # 严格模式：改了 package.json 却忘了更新锁文件，PR 在这里就红 ——
      # 放宽成 --frozen-lockfile=false 正好把这条最常见的错放过去。
      # 署名闸门：任何一笔提交的作者/提交者命中内网/公司域名就红。
      # 放在安装依赖之前：它不需要任何依赖，也不该等到装完才发现署名不对。
      - run: node scripts/check-commit-identity.mjs --all
      - run: pnpm install --frozen-lockfile
      # 构建产物 `lib/client.js` 是提交进仓库的：这条命令同时验证"它能被重新构建出来"
      # 与"当前提交进去的那份就是用当前 src/ 构建的"（tests/freshness.spec.mjs）。
      - run: pnpm run verify
